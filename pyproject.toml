[project]
name = "mcp-ads-arxiv"
version = "0.1.0"
description = "Local astrophysics paper library MCP server: NASA ADS discovery + arXiv LaTeX + PDF->markdown, never reads raw PDFs."
readme = "README.md"
license = "MIT"
authors = [
    { name = "estevesjh", email = "johnny.udi@gmail.com" }
]
requires-python = ">=3.11"
keywords = ["mcp", "nasa", "ads", "arxiv", "astrophysics", "literature-review", "docling"]
dependencies = [
    "fastmcp>=2.0,<4.0",
    "httpx>=0.27",
    "arxiv-to-prompt>=0.13",
    "mcp-server-ads @ git+https://github.com/cbyrohl/mcp-server-ads",
    "bibtexparser>=1.4",
]

[project.optional-dependencies]
pdf = ["docling>=2.0"]

[project.scripts]
mcp-ads-arxiv = "mcp_ads_arxiv.server:main"

[project.urls]
Homepage = "https://github.com/estevesjh/mcp-ads-arxiv"
Issues = "https://github.com/estevesjh/mcp-ads-arxiv/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: live tests that hit NASA ADS / arXiv (require ADS_API_TOKEN)",
]
